<div *ngIf="restaurant" class="restaurant-card">
  <!-- Restaurant Image -->
  <div class="restaurant-image-container">
    <img [src]="restaurant.restImageUrl || defaultImage" alt="Restaurant Image" />
  </div>

  <h2>{{ restaurant.name }}</h2>
  <p><strong>Address:</strong> {{ restaurant.address }}</p>
  <p><strong>Phone:</strong> {{ restaurant.phone }}</p>
  <p><strong>Open Now:</strong> {{ restaurant.isOpen ? 'Yes' : 'No' }}</p>

  <div class="actions">
    <div class="action-row">
      <span>Edit this restaurant?</span>
      <button (click)="onEdit()">Edit</button>
    </div>

    <div class="action-row">
      <span>Delete this restaurant?</span>
      <button (click)="onDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Popup Modal -->
<div class="modal" *ngIf="showEditPopup">
  <div class="modal-content">
    <span class="close" (click)="closePopup()">&times;</span>
    <h3>Edit Restaurant</h3>

    <form #restaurantForm="ngForm" (ngSubmit)="onSave(restaurantForm)">
      <label>Name:</label>
      <input type="text" [(ngModel)]="editedRestaurant.name" name="name" required #name="ngModel" />
      <div *ngIf="(name.touched || formSubmitted) && name.invalid" class="error">Name is required.</div>

      <label>Phone:</label>
      <input type="text" [(ngModel)]="editedRestaurant.phone" name="phone" required pattern="^[0-9]{10}$" #phone="ngModel" />
      <div *ngIf="(phone.touched || formSubmitted) && phone.invalid" class="error">Phone must be 10 digits.</div>

      <label>Address:</label>
      <input type="text" [(ngModel)]="editedRestaurant.address" name="address" required #address="ngModel" />
      <div *ngIf="(address.touched || formSubmitted) && address.invalid" class="error">Address is required.</div>

      <label>Is Open:</label>
      <select [(ngModel)]="editedRestaurant.isOpen" name="isOpen" required>
        <option [value]="true">Yes</option>
        <option [value]="false">No</option>
      </select>

      <label>Restaurant Image (optional):</label>
      <input type="text" [(ngModel)]="editedRestaurant.restImageUrl" name="restImageUrl" placeholder="Enter image URL (optional)" />

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>

<div *ngIf="!restaurant">
  <p>Loading restaurant details...</p>
</div>
