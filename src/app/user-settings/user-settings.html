<div *ngIf="user" class="user-card">
  <h2>{{ user.fullName }}</h2>
  <p><strong>Phone:</strong> {{ user.phone }}</p>
  <p><strong>Email:</strong> {{ user.email }}</p>
  <p><strong>Address:</strong> {{ user.address }}</p>

  <div class="actions">
    <div class="action-row">
      <span>Do you want to edit this user?</span>
      <button (click)="onEdit()">Edit</button>
    </div>

    <div class="action-row">
      <span>Are you sure you want to delete this user?</span>
      <button (click)="onDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Popup Modal -->
<div class="modal" *ngIf="showEditPopup">
  <div class="modal-content">
    <span class="close" (click)="closePopup()">&times;</span>
    <h3>Edit User</h3>

    <form #userForm="ngForm" (ngSubmit)="onSave(userForm)">
      <label>Name:</label>
      <input type="text" [(ngModel)]="editedUser.fullName" name="fullName" required #fullName="ngModel" />
      <div *ngIf="(fullName.touched || formSubmitted) && fullName.invalid" class="error">Name is required.</div>

      <label>Phone:</label>
      <input type="text" [(ngModel)]="editedUser.phone" name="phone" required pattern="^[0-9]{10}$" #phone="ngModel" />
      <div *ngIf="(phone.touched || formSubmitted) && phone.invalid" class="error">Phone must be 10 digits.</div>

      <label>Address:</label>
      <input type="text" [(ngModel)]="editedUser.address" name="address" required #address="ngModel" />
      <div *ngIf="(address.touched || formSubmitted) && address.invalid" class="error">Address is required.</div>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>

<div *ngIf="!user">
  <p>Loading user details...</p>
</div>
