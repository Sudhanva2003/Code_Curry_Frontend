<div class="open-orders-container">
  <h2 class="section-title">Open Orders</h2>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error">{{ error }}</div>

  <div *ngIf="!loading && orders.length === 0" class="empty-msg">
    No open orders
  </div>

  <div class="order-list" *ngIf="!loading && orders.length > 0">
    <div class="order-card" *ngFor="let order of orders">
      <h4>Order #{{ order.orderId }}</h4>
      <p><strong>Date:</strong> {{ order.orderDate | date:'medium' }}</p>
      <p>
        <strong>Status:</strong>
        <span [ngClass]="{
          'cancelled': order.status.startsWith('CancelledBy'),
          'paid': order.status === 'Paid'
        }">
          {{ order.status }}
        </span>
      </p>
      <p><strong>Total:</strong> ₹{{ order.totalAmount }}</p>

      <div class="order-items">
        <div class="item" *ngFor="let item of order.items">
          <span>{{ item.foodName }} (x{{ item.quantity }})</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="order-actions">
        <!-- Mark Prepared for Paid Orders -->
        <button *ngIf="order.status === 'Paid' || order.status=='Assigned'" (click)="markPrepared(order.orderId)">
          Mark Prepared
        </button>

        <!-- Cancel Order for Paid Orders -->
        <button *ngIf="order.status === 'Paid'|| order.status=='Assigned'" (click)="cancelOrder(order.orderId)">
          Cancel Order
        </button>
      </div>
    </div>
  </div>
</div>
