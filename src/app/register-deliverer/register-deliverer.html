<div class="register-container">
  <h2>Register Deliverer</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field">
      <input type="text" formControlName="fullName" placeholder="Full Name" />
      <div *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched" class="error">
        Full Name is required.
      </div>
    </div>

    <div class="form-field">
      <input type="text" formControlName="address" placeholder="Address" />
      <div *ngIf="form.get('address')?.invalid && form.get('address')?.touched" class="error">
        Address is required.
      </div>
    </div>

    <div class="form-field">
      <input type="email" formControlName="email" placeholder="Email" />
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error">
        Enter a valid email.
      </div>
    </div>

    <div class="form-field">
      <input type="text" formControlName="phone" placeholder="Phone (10 digits)" />
      <div *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched" class="error">
        Phone is required and must be 10 digits.
      </div>
    </div>

    <div class="form-field">
      <input type="text" formControlName="licenseNumber" placeholder="License Number(alphanumeric 6 to 15 characters)" />
      <div *ngIf="form.get('licenseNumber')?.invalid && form.get('licenseNumber')?.touched" class="error">
        License Number must be alphanumeric, 6-15 characters.
      </div>
    </div>

    <div class="form-field">
      <input type="text" formControlName="vehicleNumber" placeholder="Vehicle Number(alphanumeric 6 to 12 characters)" />
      <div *ngIf="form.get('vehicleNumber')?.invalid && form.get('vehicleNumber')?.touched" class="error">
        Vehicle Number must be alphanumeric, 6-12 characters.
      </div>
    </div>

    <div class="form-field">
      <input type="password" formControlName="password" placeholder="Password" />
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error">
        Password must be at least 6 characters.
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Register</button>
  </form>
</div>
