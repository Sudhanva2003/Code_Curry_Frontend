<div class="menu-page">
  <div class="menu-header">
    <h1>Restaurant Menu</h1>
    <button class="add-btn" (click)="openAddPopup()">+ Add Food</button>
  </div>

  <div *ngIf="loading" class="center">Loading menu...</div>
  <div *ngIf="error" class="center error">{{ error }}</div>
  <div *ngIf="!loading && !error && menuItems.length === 0" class="center">No menu items found.</div>

  <!-- horizontal card list -->
  <div class="card-list" *ngIf="menuItems.length > 0">
    <div class="card" *ngFor="let item of menuItems">
      <div class="card-left">
        <div class="food-image-container">
          <img [src]="item.foodImageUrl || defaultFoodUrl" alt="Food Image" />
        </div>
        <h3>{{ item.name }}</h3>
        <p class="meta">{{ item.category }}</p>
        <p class="desc">{{ item.description }}</p>
      </div>

      <div class="card-right">
        <div class="price">{{ formatPrice(item.price) }}</div>
        <div class="avail" [ngClass]="{'off': !item.isAvailable}">
          {{ item.isAvailable ? 'Available' : 'Not available' }}
        </div>
        <div class="actions">
          <button class="btn edit" type="button" (click)="onEdit(item)">Edit</button>
          <button class="btn del" type="button" (click)="onDelete(item)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div *ngIf="showEditPopup" class="menu-modal-backdrop">
  <div class="menu-modal-container">
    <div class="menu-modal-header">
      <h2>Edit Food Item</h2>
      <button type="button" class="menu-modal-close" (click)="closePopup()">&times;</button>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSave()" class="menu-modal-form">
      <div class="menu-form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" placeholder="Enter food name" />
      </div>

      <div class="menu-form-row">
        <div class="menu-form-group">
          <label>Category *</label>
          <input type="text" formControlName="category" placeholder="veg/non veg/vegan" />
        </div>
        <div class="menu-form-group">
          <label>Price *</label>
          <input type="number" formControlName="price" step="0.01" placeholder="0.00" />
        </div>
      </div>

      <div class="menu-form-group">
        <label>Description *</label>
        <textarea formControlName="description" placeholder="Describe the dish..." rows="3"></textarea>
      </div>

      <div class="menu-form-group">
        <label>Food Image URL (optional)</label>
        <input type="text" formControlName="foodImageUrl" placeholder="Enter image URL" />
      </div>

      <div class="menu-form-group">
        <label class="menu-checkbox">
          <input type="checkbox" formControlName="isAvailable" />
          <span>Available for order</span>
        </label>
      </div>

      <div class="menu-modal-actions">
        <button type="button" class="menu-btn-secondary" (click)="closePopup()">Cancel</button>
        <button type="submit" class="menu-btn-primary" [disabled]="editForm.invalid">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- ADD MODAL -->
<div *ngIf="showAddPopup" class="menu-modal-backdrop">
  <div class="menu-modal-container">
    <div class="menu-modal-header">
      <h2>Add New Food Item</h2>
      <button type="button" class="menu-modal-close" (click)="closePopup()">&times;</button>
    </div>

    <form [formGroup]="addForm" (ngSubmit)="onAddSave()" class="menu-modal-form">
      <div class="menu-form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" placeholder="Enter food name" />
      </div>

      <div class="menu-form-row">
        <div class="menu-form-group">
          <label>Category *</label>
          <input type="text" formControlName="category" placeholder="veg/non veg/vegan" />
        </div>
        <div class="menu-form-group">
          <label>Price *</label>
          <input type="number" formControlName="price" step="0.01" placeholder="0.00" />
        </div>
      </div>

      <div class="menu-form-group">
        <label>Description *</label>
        <textarea formControlName="description" placeholder="Describe the dish..." rows="3"></textarea>
      </div>

      <div class="menu-form-group">
        <label>Food Image URL (optional)</label>
        <input type="text" formControlName="foodImageUrl" placeholder="Enter image URL" />
      </div>

      <div class="menu-form-group">
        <label class="menu-checkbox">
          <input type="checkbox" formControlName="isAvailable" />
          <span>Available for order</span>
        </label>
      </div>

      <div class="menu-modal-actions">
        <button type="button" class="menu-btn-secondary" (click)="closePopup()">Cancel</button>
        <button type="submit" class="menu-btn-primary" [disabled]="addForm.invalid">Add Food</button>
      </div>
    </form>
  </div>
</div>
